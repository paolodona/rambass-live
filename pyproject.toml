[project]
name = "rambass-live"
version = "0.1.0"
description = "Backing-track, drum-transcription, video and MIDI tooling for Ramba S.S. live shows"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "mido>=1.3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Everything that touches real audio. Heavier install, needed for
# `analyze`, `drums transcribe` and `click render`.
audio = [
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "scipy>=1.10",
]
# Stem separation (pulls in torch — big). Needed for `stems separate`.
separate = [
    "demucs>=4.0.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
rambass = "rambass.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rambass"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
