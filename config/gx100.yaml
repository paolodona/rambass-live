# BOSS GX-100 MIDI configuration.
#
# `channel` must match MENU:MIDI:MIDI SETTING:RX CHANNEL on the pedal.
# Per-song overrides live in each song.yaml under `gx100.channel`.
channel: 1

# The GX-100 resolves an incoming program change through its own
# MENU:MIDI:PROGRAM MAP, so this file has to mirror what is programmed into the
# unit — otherwise the backing track will send PC 7 and the pedal will jump to
# whatever *it* thinks slot 7 is.
#
# With `sequential_default: true` we assume the straightforward layout:
#
#     bank 0, PC 0   -> U01-1        bank 0, PC 4   -> U02-1
#     bank 0, PC 1   -> U01-2        ...
#     bank 0, PC 2   -> U01-3        bank 0, PC 127 -> U32-4
#     bank 0, PC 3   -> U01-4        bank 1, PC 0   -> U33-1
#
# Run `rambass gx100 map --limit 40` to print the table, then verify a couple of
# rows against the pedal before trusting it: send PC 4 and check that U02-1
# lights up. If the pedal disagrees, either reprogram its PROGRAM MAP or list the
# real mapping under `assignments` below.
sequential_default: true

# The four patches the band actually uses, from Sounds/Settings.docx in the
# album Drive folder. The 2023 live Reaper projects send bank 0 with program
# changes 0, 1 and 2 only, which lines up with the first three of these.
#
# The memory names below are the sequential-default guess for PC 0-3. Confirm
# against the pedal (and against Sounds/"2023-08-04 GX-100.alb", which is the
# pedal backup) before relying on them.
assignments:
  - {bank: 0, pc: 0, memory: U01-1, note: "Clean Acustic"}
  - {bank: 0, pc: 1, memory: U01-2, note: "Lead"}
  - {bank: 0, pc: 2, memory: U01-3, note: "WAH"}
  - {bank: 0, pc: 3, memory: U01-4, note: "Clean Clean"}

# Reference, from the official MIDI implementation (ver 1.10):
#   bank select   CC#0 = 0..2, then CC#32 = 0
#   program change 0..127 within the selected bank
#   assign sources CC#1-31, CC#33-63, CC#64-95
#   MIDI clock     followed when MENU:MIDI:MIDI SETTING:SYNC CLOCK != INTERNAL
