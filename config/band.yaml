# ─────────────────────────────────────────────────────────────────────────
# Who plays what — the input to per-member practice tracks.
#
# Nothing reads this file yet. It is Phase 0 of docs/practice-tracks.md.
#
# It has nothing to do with the show: the gig session does not care who plays
# what. This drives only `rambass practice`.
# ─────────────────────────────────────────────────────────────────────────

# Three people. Drums are the backing track, so there is no drums part here and
# no minus-drums track: the nearest thing to a drummer's practice track is the
# gig base itself.
members:
  - name: Domenico
    nickname: Meco
    part: vocals
    track: minus-vocals
    note: |
      The `vocals` stem carries backing vocals too, so this removes them as
      well. If the base carries backing vocals live, that is wrong in the same
      way Vikingo's minus-guitar track would be — see the "rule this is an
      instance of" section in docs/practice-tracks.md. OPEN QUESTION: who sings
      backing vocals live?

  - name: Marzio
    nickname: Maf
    part: bass
    track: minus-bass
    note: |
      The clean case. Bass is the stem demucs separates best, the part appears
      once in the recording and is played entirely live, so the minus-one track
      is correct rather than merely useful.

  - name: Paolo
    nickname: Vikingo
    part: guitar
    track: full
    note: |
      Deliberately NOT minus-guitar. The guitars are layered on the recordings
      and the extra layers will be in the gig backing track, so removing the
      `other` stem would take away both what he plays live and what he will
      hear through the PA. `full` keeps every layer with his own part as the
      reference; switch this to `base` per song as each base lands, because a
      base plus click is exactly what he hears on stage.

# How a part maps onto demucs 4-stem output, for the tracks that are built by
# separation. `full` and `base` need no entry: they subtract nothing.
parts:
  vocals: {stems: [vocals]}
  bass:   {stems: [bass]}
  guitar:
    stems: [other]
    note: |
      `other` is everything that is not drums, bass or voice — guitars, keys,
      whatever else. Only used for an explicit `--parts guitar` request; it is
      not anyone's default. htdemucs_6s can split a real `guitar` stem out per
      song, but the layering means that does not rescue the track either.
