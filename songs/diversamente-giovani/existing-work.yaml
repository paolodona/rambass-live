# What already exists for this album, and where.
#
# Diversamente Giovani starts from a very different place than Tutti in Fila:
# the drums were played and recorded (Aerodrums capture -> BFD3 sounds), the
# production tempos are known, six songs already have hand-timed lyric SRTs and
# rendered lyric videos, and eight songs already have live Reaper projects.
#
# None of that should be redone. This file records where it is so it can be
# imported. Nothing here is read by the tools automatically — it is the map.

drive:
  album_masters: https://drive.google.com/drive/folders/1Ceu5N9WGc0YJx_3skEkjLmOvUEAgkHDg
  recording_backup: https://drive.google.com/drive/folders/1tKkhr_ZVsFLhauc1CtBtJe9UKgYjT9a_
  live_projects: https://drive.google.com/drive/folders/1388pvUqImDKuc7dIlcMbC3DOHb1XZZOd
  srt: https://drive.google.com/drive/folders/176c6CfpIgiVpczAgdXKeCWdZKneKFxFr
  lyrics_videos: https://drive.google.com/drive/folders/17VMV2fu9A8U31WR-UjkexWBXB9UEzfLM
  video_exports: https://drive.google.com/drive/folders/11i8-7cuh3qscR5H4-SUCK-xZHzyepFB-
  production_folders: https://drive.google.com/drive/folders/1o4l80TevAg1prPloA1bBjI8oG1DLHRmM
  bfd3_presets: https://drive.google.com/drive/folders/1Uc2lc1lFkhBuvQHxl12QFHgNhYPQr3k0

# The drum chain, which decides how the drums get rebuilt.
drums:
  capture: Aerodrums          # .aer session files sit next to the drum stems
  sounds: BFD3                # one .bfd3 preset per song, see bfd3_presets above
  note: |
    The drums were not played on an acoustic kit and are not MIDI in the album
    project either — they were rendered to audio per song. Two consequences:
      * an isolated drum stem exists for most songs, so `rambass drums
        transcribe` runs on a clean signal instead of a demucs separation, and
        will be far more accurate than for Tutti in Fila;
      * the .aer files may still hold the original performance data. If
        Aerodrums can export MIDI from them, that beats transcribing audio —
        check before spending time on transcription.

