# The running order, built on the standard shape: a recognisable opener, runs of
# three or four, two real troughs, two peaks, and the biggest thing last.
# `rambass arc gig` shows the shape and checks it.
#
# 23 songs. Three were cut (Intro Portamistica Z.Z.I., La Canzone Del Solero,
# OUTRO) and are marked `excluded` in their own song.yaml.
#
# Why the order is what it is — the decisions worth arguing with:
#
#   * The three hits are front-loaded (I Puffi, Tutti In Fila, ForMayGrana).
#     The front of the set is where you buy the audience's attention for
#     everything after it.
#   * The deep cuts are clustered at 12-15 (Intro Vibratore, La Vera Storia,
#     Skizzo, Mandami un Faxe) — the middle is where unfamiliar material belongs,
#     carried by the known songs either side. It is also where a long song like
#     Skizzo costs least.
#   * Diversamente Giovani, the newest and least-known song, sits at 17 — mid-set
#     and directly after Bambolina, one of the famous ones.
#   * Mandami un Faxe is the riskiest song to place, being slow, repetitive and
#     prolonged. It is the deliberate second trough at 15, deep enough into the
#     set that it reads as a change of pace rather than a lull.
#   * The two a cappella numbers (10, 20) are the only points where the laptop
#     does nothing. They are spread apart on purpose: they are both the
#     breathers and the natural places to talk, retune, or recover if something
#     has gone wrong.
#   * The last three are known, known, hit. Mother Sacher at 22 is the heaviest
#     thing in the set, and La Ragazza follows it as the anthem — brutal, then
#     the singalong. La Ragazza is not the highest-energy song by number, but
#     its repeatable finale is what actually ends a show.
#   * Orologiaio at 7 is ninety seconds of death metal with a guest, straight
#     after bluesy rock. It costs almost no time and the contrast is the point.
#   * Intro Vibratore is attached to La Vera Storia Del Vibratore — they run
#     together as one backing track and must not be separated.
name: Ramba S.S. — the set
date: ""
venue: ""
notes: |
  Shape: open hard on three hits, first trough at Manlio, peak at Orologiaio and
  Itturfiatrugoy, breathe on Tonno. Restart, work through the deep cuts, second
  trough at Mandami un Faxe, climb back on Bambolina. Last breather at Se Sei
  Felice, then Mother Sacher — the heaviest thing we have — into La Ragazza da
  Milano, whose finale repeats as long as it keeps working.

  Two songs need no playback at all: La Canzone Del Tonno and Se Sei Felice.
