# The running order. Nothing downstream depends on the order, so reorder freely —
# `rambass setlist gig` re-times it and `rambass reaper setlist gig` rebuilds the
# whole-show project.
#
# 23 songs are in scope. Three were cut and are not listed here; they are also
# marked `excluded` in their own song.yaml so they drop off `rambass status`:
#
#   Tutti in Fila 01  Intro Portamistica Z.Z.I.
#   Tutti in Fila 10  La Canzone Del Solero
#   Diversamente Giovani 15  OUTRO
#
# Two songs are sung unaccompanied and need no backing track, click, count-in or
# pedal change — they are in the running order but not in the playback project:
#
#   Tutti in Fila 07  La Canzone Del Tonno
#   Diversamente Giovani 11  Se Sei Felice
#
name: Ramba S.S. — the set
date: ""
venue: ""
notes: |
  Order below is a starting point, grouped so the seven songs that are already
  finished carry the front of the set.

  The two a cappella numbers are deliberately placed to break up the backing
  tracks — they are the only points in the set where the laptop does nothing, so
  they are also the natural spots to talk, retune, or recover if anything has
  gone wrong.

  Diversamente Giovani INTRO and Tutti in Fila's Intro Vibratore are short
  linking pieces that play as straight album audio. Intro Vibratore runs into
  La Vera Storia Del Vibratore and should be treated as one backing track with it.
