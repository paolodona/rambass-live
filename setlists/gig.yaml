# The running order, built on the standard shape: a recognisable opener, runs of
# three or four, two real troughs, two peaks, and the biggest thing last.
# `rambass arc gig` shows the shape and checks it.
#
# 28 songs: 23 originals plus a 5-song covers set (The Final Countdown, 18 and
# Life, I Want It All, John Holmes, Danneggia l'Erezione — see songs/covers/,
# each with its own placement rationale in character.note). Three originals
# were cut (Intro Portamistica Z.Z.I., La Canzone Del Solero, OUTRO) and are
# marked `excluded` in their own song.yaml.
#
# Why the order is what it is — the decisions worth arguing with:
#
#   * I Puffi is at 27, not at the front. It is the signature song — the one
#     people came for — and that is a card you play once. Metallica ran 99 shows
#     on the M72 tour with no encore at all, and put Enter Sandman at 17 and
#     Master of Puppets at 18, of 19. The biggest songs go near the end of the
#     main set: not spent first, and not held back for an encore either.
#   * ForMayGrana opens instead: a hit, upbeat and happy, with a riff they know
#     straight away. The slot wants recognisable and upper-mid, not the heaviest
#     thing available — opening on Mother Sacher would be the mistake.
#   * Tutti In Fila at 3 locks the room in behind the opener.
#   * The covers land at 9-11 and 14/17, not bunched at the front or held for an
#     encore — same argument as I Puffi. Three of the five (Final Countdown, 18
#     and Life, I Want It All) run as a block right after peak 1
#     (Orologiaio → Itturfiatrugoy), because they are all internationally known
#     crowd-pleasers and the room is already up: Final Countdown opens the block
#     at full anthem energy, 18 and Life is the block's own internal breather
#     (minor-key, narrative, the only one of the three that isn't a driver), and
#     I Want It All closes it back at full energy before Tonno's a cappella
#     breather actually drops the room. The other two are placed by what they
#     are, not grouped with the English-language block: John Holmes is a fast
#     comedic detour, the same role Orologiaio already plays, so it sits inside
#     the deep-cuts run instead of next to Orologiaio — two gag songs back to
#     back would blunt both. Danneggia l'Erezione is a genuine deep cut (from
#     Tiromancino's 1995 alt/funk-rock debut, not their later, better-known
#     sound) and goes where deep cuts go: mid-set, carried by known material
#     either side.
#   * The deep-cuts run is now Ampiamente Contestabile → John Holmes → Intro
#     Vibratore → La Vera Storia → Danneggia l'Erezione → Skizzo (15-20) — the
#     middle is where unfamiliar material belongs, carried by the known songs
#     either side. It is also where a long song like Skizzo costs least.
#   * Diversamente Giovani, the newest and least-known original, sits at 21 —
#     mid-set and directly after Bambolina, one of the famous ones.
#   * Mandami un Faxe is the riskiest song to place, being slow, repetitive and
#     prolonged. It is the deliberate second trough at 19, deep enough into the
#     set that it reads as a change of pace rather than a lull.
#   * The two a cappella numbers (12, 24) are the only points where the laptop
#     does nothing. They are spread apart on purpose: they are both the
#     breathers and the natural places to talk, retune, or recover if something
#     has gone wrong.
#   * The closing run is Mother Sacher (heaviest) → I Puffi (signature) → La
#     Ragazza (the anthem), untouched by the covers. That mirrors the shape
#     above: the two biggest at 26 and 27, with the structural ender last. La
#     Ragazza is not the highest-energy song by number, but a finale that
#     repeats as long as it keeps working is what actually ends a show.
#   * Orologiaio at 7 is ninety seconds of death metal with a guest, straight
#     after bluesy rock. It costs almost no time and the contrast is the point.
#   * Intro Vibratore is attached to La Vera Storia Del Vibratore — they run
#     together as one backing track and must not be separated.
#
# The five covers are `drums.origin: programmed` placeholders — title, best
# available tempo and a character read, nothing produced yet. Danneggia
# l'Erezione's tempo is explicitly unverified (not indexed anywhere checked);
# don't treat 120 BPM as measured. None of the five have a source recording,
# stems, drum MIDI, video or GX-100 programming yet — that is real work still
# to do, this pass only settles where they go.
name: Ramba S.S. — the set
date: ""
venue: ""
notes: |
  Shape: open on ForMayGrana and Tutti In Fila, first trough at Manlio, peak at
  Orologiaio into Itturfiatrugoy. Straight from that peak into the covers block
  (The Final Countdown, 18 and Life, I Want It All) while the room is already up,
  then breathe on Tonno. Restart, work through the deep cuts — now carrying John
  Holmes and Danneggia l'Erezione alongside the original run — second trough at
  Mandami un Faxe, climb back on Bambolina. Last breather at Se Sei Felice, then
  the closing run: Mother Sacher, I Puffi, La Ragazza da Milano — whose finale
  repeats as long as it keeps working.

  No encore. The big songs are in the set, not held back behind a walk-off.

  Two songs need no playback at all: La Canzone Del Tonno and Se Sei Felice.
